<style>
        body, html {

            content: '|';
            animation: blink 1s step-end infinite;

<body class="bg-background text-on-background font-body-md overflow-hidden select-none">
<!-- Splash Content Wrapper -->
<main class="relative h-screen w-screen flex items-center justify-center">
<!-- Background Artistic Illustration -->
<div class="bg-splash"></div>
<!-- Glassmorphism/Vignette Overlay for Legibility -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-background/40 pointer-events-none"></div>
<!-- Central Content Canvas -->
<div class="relative z-10 flex flex-col items-center text-center max-w-2xl px-margin-mobile md:px-margin-desktop">
<!-- Typewriter Text Container -->
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background typewriter-cursor tracking-tight mb-20 leading-relaxed" id="typewriter">
<!-- Text will be injected by JS -->
</h1>
<!-- Minimal "Click to Enter" Prompt -->
<div class="fade-in opacity-0 mt-20 flex flex-col items-center cursor-pointer group" id="enter-prompt" onclick="location.href='#'" style="animation-delay: 3s;">
<p class="font-label-sm text-label-sm text-ink-blue tracking-[0.3em] mb-4 group-hover:opacity-70 transition-opacity">
                    CLICK TO ENTER
                </p>
<div class="w-[1px] h-12 bg-ink-blue/30 relative overflow-hidden group-hover:bg-ink-blue/60 transition-colors">
<div class="absolute top-0 left-0 w-full h-1/2 bg-ink-blue floating-action"></div>
</div>
</div>
</div>
<!-- Top Brand Identity (Corner Anchor) -->
<div class="absolute top-10 left-1/2 -translate-x-1/2 md:left-margin-desktop md:translate-x-0 z-20">
<span class="font-headline-md text-headline-md tracking-[0.2em] text-on-background mix-blend-multiply opacity-80">
                Y. NAKAMURA
            </span>
</div>
<!-- Bottom Social/Info Indicator (Subtle Decoration) -->
<div class="absolute bottom-10 right-margin-desktop hidden md:flex flex-col items-end gap-2 opacity-40 z-20">
<span class="font-label-sm text-[10px] tracking-widest text-on-background">TOKYO / CURATED GALLERY</span>
<span class="font-label-sm text-[10px] tracking-widest text-on-background">EST. 2024</span>
</div>
</main>
<script>
        // Typewriter Animation Logic
        const text = "我在人间流浪，翻看灵魂的颜色";
        const typewriterElement = document.getElementById('typewriter');
        let index = 0;

        function type() {
            if (index < text.length) {
                typewriterElement.innerHTML += text.charAt(index);
                index++;
                // Slight randomization for natural feel
                setTimeout(type, 150 + Math.random() * 100);
            } else {
                // Remove cursor animation once finished typing
                typewriterElement.classList.remove('typewriter-cursor');
            }
        }

        // Start animation after a brief initial pause
        window.addEventListener('load', () => {
            setTimeout(type, 800);
        });

        // Simple enter interaction (Haptic/Visual feedback simulation)
        document.getElementById('enter-prompt').addEventListener('mousedown', function() {
            this.style.transform = 'scale(0.98)';
        });
        document.getElementById('enter-prompt').addEventListener('mouseup', function() {
            this.style.transform = 'scale(1)';
        });
    </script>
