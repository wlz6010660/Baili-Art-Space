<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>故障艺术作品详情 | 百里绘画作品</title>
    <meta name="description" content="百里故障艺术系列单张作品详情，包含作品图片、设计灵感、作品故事和一句话。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=glitch-20260611" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="index.html#top" aria-label="回到首页">
          <span>BAILI</span>
          <small>Colors of the Soul</small>
        </a>
        <nav class="nav" aria-label="故障艺术详情页导航">
          <a href="art-gallery.html">ART GALLERY</a>
          <a href="art-glitch.html">GLITCH</a>
          <a href="shop.html">SHOP</a>
        </nav>
      </header>

      <main data-glitch-detail>
        <section class="artwork-detail-hero">
          <div>
            <p class="label" data-work-index>GLITCH ART</p>
            <h1 data-work-title>故障艺术</h1>
          </div>
          <a class="text-link" href="art-glitch.html">返回故障艺术系列</a>
        </section>

        <section class="artwork-detail">
          <figure>
            <img data-work-image src="assets/illustrations/glitch-art/镜中的自己.jpg" alt="故障艺术作品" />
          </figure>
          <div class="artwork-detail-copy">
            <div class="artwork-quote" data-work-quote></div>
            <article>
              <p class="label">DESIGN INSPIRATION</p>
              <h2>设计灵感</h2>
              <p data-work-inspiration></p>
            </article>
            <article>
              <p class="label">WORK STORY</p>
              <h2>作品故事</h2>
              <p data-work-story></p>
            </article>
            <nav class="artwork-nav" aria-label="故障艺术作品切换">
              <a data-prev-work href="art-glitch.html">上一张</a>
              <a data-next-work href="art-glitch.html">下一张</a>
            </nav>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>© 2026 百里 / 故障艺术详情</span>
        <a href="art-glitch.html">返回故障艺术系列</a>
      </footer>
    </div>

    <script src="assets/illustrations/glitch-art/glitch-art-data.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const requestedSlug = params.get("work");
      const works = window.glitchArtWorks;
      const currentIndex = Math.max(
        0,
        works.findIndex((item) => item.slug === requestedSlug)
      );
      const work = works[currentIndex];
      const previous = works[(currentIndex - 1 + works.length) % works.length];
      const next = works[(currentIndex + 1) % works.length];

      document.title = `${work.title} | 故障艺术 | 百里绘画作品`;
      document.querySelector("[data-work-index]").textContent =
        `GLITCH ART / ${String(currentIndex + 1).padStart(2, "0")} OF ${works.length}`;
      document.querySelector("[data-work-title]").textContent = work.title;
      document.querySelector("[data-work-image]").src = work.image;
      document.querySelector("[data-work-image]").alt = work.title;
      document.querySelector("[data-work-quote]").textContent = work.quote;
      document.querySelector("[data-work-inspiration]").textContent = work.inspiration;
      document.querySelector("[data-work-story]").textContent = work.story;
      document.querySelector("[data-prev-work]").href = `art-glitch-detail.html?work=${previous.slug}`;
      document.querySelector("[data-prev-work]").textContent = `上一张 / ${previous.title}`;
      document.querySelector("[data-next-work]").href = `art-glitch-detail.html?work=${next.slug}`;
      document.querySelector("[data-next-work]").textContent = `下一张 / ${next.title}`;
    </script>
  </body>
</html>
